server {
    include /etc/nginx/snippets/codex-deny-scanners.conf;
    server_name focus-v2.dmnao83.ru;

    root /opt/focus-v2/public;
    index index.html;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4178/api/;
        client_max_body_size 2m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/focus-v2.dmnao83.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/focus-v2.dmnao83.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    include /etc/nginx/snippets/codex-deny-scanners.conf;
    if ($host = focus-v2.dmnao83.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name focus-v2.dmnao83.ru;
    return 404; # managed by Certbot


}
